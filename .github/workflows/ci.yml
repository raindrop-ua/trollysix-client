name: CI

on:
  push:
    branches: [main, release, develop]
  pull_request:
    branches: [main, release, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test --watch=false

      - name: Build
        run: pnpm build

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Build SSR bundle
        run: pnpm build

      - name: Run SSR smoke E2E
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:4500
        run: |
          pnpm start:ssr:e2e > /tmp/ssr.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true; cat /tmp/ssr.log' EXIT
          for i in {1..60}; do
            if curl -sSf "$CYPRESS_BASE_URL" > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -sSf "$CYPRESS_BASE_URL" > /dev/null 2>&1
          pnpm e2e
