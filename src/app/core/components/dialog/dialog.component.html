<dialog
  #dialog
  id="dialog"
  aria-labelledby="dialog-title"
  aria-modal="true"
  role="alertdialog"
  class="z-10 fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent"
  (cancel)="onCancelEvent($event)"
>
  <div
    tabindex="0" class="fixed inset-0 bg-gray-900/60 transition-opacity data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in"
    inert=""
    role="button"
    (click)="onBackdropClick()"
  ></div>

  <div
    tabindex="0"
    class="flex min-h-full items-end justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0"
  >
    <div class="relative transform overflow-hidden rounded-2xl bg-gray-800/90 backdrop-blur text-left shadow-xl outline -outline-offset-1 outline-white/10 transition-all data-closed:translate-y-4 data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in sm:my-8 sm:w-full sm:max-w-lg data-closed:sm:translate-y-0 data-closed:sm:scale-95">
      <div class="bg-gray-100/90 dark:bg-gray-800 px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
        <div class="sm:flex sm:items-start">
          <div
            class="mx-auto flex size-12 shrink-0 items-center justify-center rounded-full sm:mx-0 sm:size-10"
            [ngClass]="{
              'bg-red-500/10 text-red-400': config()?.variant === 'danger',
              'bg-blue-500/10 text-blue-400': config()?.variant === 'info',
              'bg-yellow-500/10 text-yellow-400': config()?.variant === 'warning',
              'bg-green-500/10 text-green-500 dark:text-green-400': config()?.variant === 'success'
            }"
          >
            <svg
              icon="info"
              width="24"
              height="24"
              stroke="currentColor"
              stroke-width="2"
            ></svg>
          </div>

          <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
            <h3 id="dialog-title" class="text-base font-semibold text-slate-600 dark:text-slate-300">
              {{ config()?.title }}
            </h3>
            <div class="mt-2">
              <p class="text-sm text-gray-600 dark:text-gray-300">
                {{ config()?.message }}
              </p>
            </div>
          </div>
        </div>
      </div>

      <div class="bg-gray-200/90 dark:bg-gray-700/25 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
        <button
          type="button"
          class="cursor-pointer inline-flex w-full justify-center rounded-xl px-3 py-2 text-sm font-semibold text-white sm:ml-3 sm:w-auto"
          [ngClass]="{
            'bg-red-500 hover:bg-red-500/90': config()?.variant === 'danger',
            'bg-blue-500 hover:bg-blue-500/90': config()?.variant === 'info',
            'bg-yellow-500 hover:bg-yellow-500/90': config()?.variant === 'warning',
            'bg-green-500 hover:bg-green-500/90': config()?.variant === 'success'
          }"
          (click)="onConfirmClick()"
        >
          {{ config()?.confirmText }}
        </button>

        @if (config()?.cancelText) {
          <button
            type="button"
            class="cursor-pointer mt-3 inline-flex w-full justify-center rounded-xl bg-white/10 px-3 py-2 text-sm font-semibold text-white inset-ring inset-ring-white/5 hover:bg-white/20 sm:mt-0 sm:w-auto"
            (click)="onCancelClick()"
          >
            {{ config()?.cancelText }}
          </button>
        }
      </div>
    </div>
  </div>
</dialog>
