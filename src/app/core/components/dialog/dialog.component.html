<dialog
  #dialog
  id="dialog"
  aria-labelledby="dialog-title"
  aria-modal="true"
  role="alertdialog"
  class="fixed inset-0 z-10 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent"
  (cancel)="onCancelEvent($event)"
>
  <div
    tabindex="0"
    class="fixed inset-0 bg-gray-900/60 transition-opacity data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in"
    role="button"
    inert
    (click)="onBackdropClick()"
  ></div>

  <div
    tabindex="0"
    class="flex min-h-full items-end justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0"
  >
    <div
      class="relative transform overflow-hidden rounded-2xl bg-gray-800/90 text-left shadow-xl outline -outline-offset-1 outline-white/10 backdrop-blur transition-all data-closed:translate-y-4 data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in sm:my-8 sm:w-full sm:max-w-lg data-closed:sm:translate-y-0 data-closed:sm:scale-95"
    >
      <div
        class="bg-gray-100/90 px-5 pt-5 pb-4 sm:p-6 sm:pb-5 dark:bg-gray-800"
      >
        <div class="sm:flex sm:items-start">
          <div
            class="mx-auto flex size-12 shrink-0 items-center justify-center rounded-full bg-slate-500 sm:mx-0 sm:size-10"
            [ngClass]="{
              'text-red-400/90 dark:bg-red-500/10 dark:text-red-400':
                config()?.variant === 'danger',
              'text-blue-200 dark:bg-blue-500/10 dark:text-blue-400':
                config()?.variant === 'info',
              'text-yellow-400 dark:bg-yellow-500/10':
                config()?.variant === 'warning',
              'text-green-500 dark:bg-green-500/10 dark:text-green-400':
                config()?.variant === 'success',
            }"
          >
            @let icon = config()?.customIcon ?? 'info';
            <svg
              [icon]="icon"
              class="size-6"
              stroke="currentColor"
              stroke-width="2"
            ></svg>
          </div>

          <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
            <h3
              id="dialog-title"
              class="text-base font-semibold text-slate-600 dark:text-slate-300"
            >
              {{ config()?.title }}
            </h3>
            <div class="mt-2">
              <p class="text-sm text-gray-600 dark:text-gray-300">
                {{ config()?.message }}
              </p>
            </div>
          </div>
        </div>
      </div>

      <div
        class="bg-gray-200/90 px-4 py-4 sm:flex sm:flex-row-reverse sm:px-6 dark:bg-gray-700/25"
      >
        <button
          type="button"
          class="inline-flex w-full cursor-pointer justify-center rounded-xl px-3 py-2 text-sm font-semibold transition hover:opacity-95 active:scale-[.98] sm:ml-3 sm:w-auto"
          [ngClass]="{
            'bg-red-500 text-white hover:bg-red-500/90':
              config()?.variant === 'danger',
            'bg-blue-500 text-white hover:bg-blue-500/90':
              config()?.variant === 'info',
            'bg-yellow-500 text-slate-800 hover:bg-yellow-500/90':
              config()?.variant === 'warning',
            'bg-green-500 text-white hover:bg-green-500/90':
              config()?.variant === 'success',
          }"
          (click)="onConfirmClick()"
        >
          {{ config()?.confirmText }}
        </button>

        @if (config()?.cancelText) {
          <button
            type="button"
            class="mt-3 inline-flex w-full cursor-pointer justify-center rounded-xl bg-slate-900/30 px-3 py-2 text-sm font-semibold text-white inset-ring inset-ring-white/5 transition hover:bg-slate-900/40 hover:opacity-95 active:scale-[.98] sm:mt-0 sm:w-auto dark:bg-white/10 dark:hover:bg-white/20"
            (click)="onCancelClick()"
          >
            {{ config()?.cancelText }}
          </button>
        }
      </div>
    </div>
  </div>
</dialog>
