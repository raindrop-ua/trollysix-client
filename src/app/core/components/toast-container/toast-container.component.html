<div
  class="pointer-events-none fixed inset-0 z-50 flex items-end justify-end px-4 py-6"
  aria-live="assertive"
  aria-atomic="true"
>
  <div class="flex w-full flex-col items-end space-y-3">
    @for (toast of toasts(); track toast.id) {
      <div class="pointer-events-auto w-full max-w-sm overflow-hidden rounded-xl bg-slate-900 text-slate-50 shadow-lg ring-1 ring-black/10 dark:bg-slate-800"
        [class]="typeClasses(toast.type)"
      >
        <div class="p-4 flex">
          <div class="flex-shrink-0 pt-0.5">
                <span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-black/10">
                  <span class="text-sm">
                    @if (toast.type === 'success') { ✓ }
                    @else if (toast.type === 'error') { ! }
                    @else { i }
                  </span>
                </span>
          </div>

          <div class="ml-3 flex-1">
            @if (toast.title) {
              <p class="text-sm font-semibold leading-5">
                {{ toast.title }}
              </p>
            }
            <p class="mt-0.5 text-sm leading-5 text-slate-100/90">
              {{ toast.message }}
            </p>
          </div>

          <div class="ml-3 flex-shrink-0">
            <button
              type="button"
              class="inline-flex rounded-full p-1 text-slate-100/70 hover:text-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-slate-200/50"
              (click)="dismiss(toast.id)"
            >
              <span class="sr-only">Close</span>
              ✕
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
