@let messages = globalMessage$ | async;

@if (messages?.length) {
  @for (message of messages; track message.id) {
    @if (message.type && message.message) {
      <section
        class="w-full px-4 py-3 text-center"
        [class]="`global-message--${message.type}`"
      >
        <p>
          {{ message.message }}
        </p>
      </section>
    }
  }
}
