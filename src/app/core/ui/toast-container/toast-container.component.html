<div
  aria-live="assertive"
  aria-atomic="true"
  class="pointer-events-none fixed inset-0 z-50 flex items-end justify-end p-6"
>
  <div class="flex w-full flex-col items-end space-y-3">
    @for (toast of toasts(); track toast.id) {
      <div
        tabindex="0"
        role="button"
        animate.enter="toast-enter-chain"
        animate.leave="toast-leave-chain"
        class="toast-panel"
        [class]="`toast-panel--${toast.type}`"
        (click)="dismiss(toast.id)"
      >
        <svg
          icon="info"
          stroke="currentColor"
          stroke-width="2"
          class="toast-icon"
          [class]="`toast-icon--${toast.type}`"
        ></svg>
        <div>
          @if (toast.title) {
            <p class="text-sm font-semibold">
              {{ toast.title }}
            </p>
          }
          <p class="mt-0.5 text-sm">
            {{ toast.message }}
          </p>
        </div>
      </div>
    }
  </div>
</div>
