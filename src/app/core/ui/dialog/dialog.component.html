<dialog
  #dialogElement
  class="app-dialog"
  [attr.aria-modal]="openMode() === 'modal'"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="descriptionId"
  tabindex="-1"
  (cancel)="onCancelEvent($event)"
  (keydown.escape)="onEscapeKeydown($event)"
  (pointerdown)="onDialogPointerDown($event)"
>
  <div class="app-dialog__viewport">
    <div
      class="app-dialog__panel"
      [class.app-dialog__panel--danger]="config()?.variant === 'danger'"
      [class.app-dialog__panel--info]="config()?.variant === 'info'"
      [class.app-dialog__panel--warning]="config()?.variant === 'warning'"
      [class.app-dialog__panel--success]="config()?.variant === 'success'"
      [class.translate-y-4]="!isVisible()"
      [class.opacity-0]="!isVisible()"
      [class.scale-95]="!isVisible()"
      [class.translate-y-0]="isVisible()"
      [class.opacity-100]="isVisible()"
      [class.scale-100]="isVisible()"
    >
      <div class="app-dialog__body">
        <div class="app-dialog__content">
          <div
            class="app-dialog__icon"
            [class.app-dialog__icon--danger]="config()?.variant === 'danger'"
            [class.app-dialog__icon--info]="config()?.variant === 'info'"
            [class.app-dialog__icon--warning]="config()?.variant === 'warning'"
            [class.app-dialog__icon--success]="config()?.variant === 'success'"
          >
            @let icon = config()?.customIcon ?? 'info';
            <svg [icon]="icon" class="size-6" stroke="currentColor"></svg>
          </div>

          <div class="app-dialog__copy">
            <h3 [id]="titleId" class="app-dialog__title">
              {{ config()?.title }}
            </h3>
            <div class="mt-2">
              <p [id]="descriptionId" class="app-dialog__message">
                {{ config()?.message }}
              </p>
            </div>
          </div>
        </div>
      </div>

      <div class="app-dialog__actions">
        <button
          type="button"
          class="app-dialog__confirm"
          [class.app-dialog__confirm--danger]="config()?.variant === 'danger'"
          [class.app-dialog__confirm--info]="config()?.variant === 'info'"
          [class.app-dialog__confirm--warning]="
            config()?.variant === 'warning'
          "
          [class.app-dialog__confirm--success]="config()?.variant === 'success'"
          (click)="onConfirmClick()"
        >
          {{ config()?.confirmText }}
        </button>

        @if (config()?.cancelText) {
          <button
            type="button"
            class="app-dialog__cancel"
            (click)="onCancelClick()"
          >
            {{ config()?.cancelText }}
          </button>
        }
      </div>
    </div>
  </div>
</dialog>
