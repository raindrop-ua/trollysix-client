<app-generic-header [title]="'Schedule'" />
@defer (on idle) {
  @if (vm$ | async; as vm) {
    <app-stops-list />
    @if (vm.selectedStop) {
      <app-stop-toolbar />
      <app-selectors-group />
      <app-schedule-controls />
      <app-stop-details [stopData]="vm.selectedStop" />
    }
    <app-notice />
  }
}
