<trollysix-generic-header [title]="copySchedule.header.title" />
@defer (on idle) {
  @if (isSelectorsGroupReady()) {
    <trollysix-selectors-group />
  }
  <trollysix-stops-list />
  @if (selectedStop(); as stop) {
    <trollysix-stop-toolbar />
    <trollysix-schedule-controls />
    <trollysix-stop-details [stopData]="stop" />
  }
  <trollysix-notice />
}
