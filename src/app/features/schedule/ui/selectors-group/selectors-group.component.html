<section class="container mx-auto max-w-6xl px-4">
  <div class="rounded-2xl baseline-borders baseline-surface p-3 backdrop-blur md:p-4">
    <div class="grid gap-3 md:grid-cols-2 lg:flex lg:items-center lg:justify-between lg:gap-0 lg:divide-x lg:divide-white/10">
      @if (vm$ | async; as vm) {
        <div class="relative flex">
          <app-options-selector
            (optionSelect)="onSelectDayType($event)"
            title="Day"
            [options]="vm.dayTypes"
            [preselected]="vm.selectedDayTypeName"
          />
        </div>
        <div class="relative flex">
          <app-options-selector
            (optionSelect)="onSelectDirection($event)"
            title="Direction"
            [options]="vm.directions"
            [preselected]="(vm$ | async)?.selectedDirectionName"
          >
            @if ((departures$ | async)?.length === 0 && !(vm$ | async)?.timetableLoading) {
              <app-hint-arrow />
            }
          </app-options-selector>
        </div>
      }
      <div class="hidden gap-4 lg:flex md:items-center md:px-3">
        <div class="text-blue-800 dark:text-blue-900">
          <svg
            icon="logo"
            width="48"
            height="60"
            stroke="currentColor"
            stroke-width="2"
          ></svg>
        </div>
      </div>
    </div>
  </div>
</section>
