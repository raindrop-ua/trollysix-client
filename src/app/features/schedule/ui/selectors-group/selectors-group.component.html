<section class="container mx-auto max-w-6xl px-4">
  <div class="rounded-2xl border border-white/10 bg-white/60 p-3 shadow-sm backdrop-blur md:p-4 dark:bg-slate-900/40">
    <div class="grid gap-3 md:grid-cols-2 lg:flex lg:items-center lg:justify-between lg:gap-0 lg:divide-x lg:divide-white/10">
      @if (vm$ | async; as vm) {
        <div class="relative flex">
          <app-options-selector
            (optionSelect)="onSelectDayType($event)"
            title="Day"
            [options]="vm.dayTypes"
            [preselected]="vm.selectedDayTypeName"
          />
        </div>
        <div class="relative flex">
          <app-options-selector
            (optionSelect)="onSelectDirection($event)"
            title="Direction"
            [options]="vm.directions"
            [preselected]="(vm$ | async)?.selectedDirectionName"
          >
            @if ((departures$ | async)?.length === 0 && !(vm$ | async)?.timetableLoading) {
              <div class="pointer-events-none absolute transition animate-bounce w-full flex items-center justify-center -bottom-22 text-yellow-500 dark:text-yellow-400">
                <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" class="translate-x-4">
                  <path d="M12.1537 1.32567C12.408 1.20193 13.0163 0.948812 13.8451 1.00915C14.689 1.0706 15.376 1.52661 15.7204 1.80216L34.5681 16.0935C35.6768 16.9342 35.7351 18.3444 34.6983 19.2435C33.6616 20.1425 31.9224 20.1897 30.8137 19.3491L17.9792 9.61728C24.6893 34.0752 39.9231 50.3309 61.4472 59.0088C62.8064 59.5568 63.3604 60.8945 62.6846 61.9966C62.0089 63.0987 60.3591 63.548 59 63C35.5216 53.5343 19.5711 35.898 12.6224 10.6144C12.5883 10.6885 12.5541 10.7631 12.5198 10.8381C10.614 15.0127 7.80047 22.6136 6.74609 26.7666C6.44 27.9721 4.98669 28.7482 3.5 28.5C2.01329 28.2518 1.05616 27.0733 1.36221 25.8678C2.49923 21.3894 5.42307 13.5442 7.36491 9.29068C8.33955 7.15578 9.26072 5.30038 9.96201 4.01772C10.3044 3.3915 10.6275 2.84051 10.8977 2.45391C10.9915 2.31983 11.2279 1.98108 11.5709 1.69892C11.6726 1.61525 11.869 1.46426 12.1537 1.32567Z" fill="currentColor" />
                </svg>
              </div>
            }
          </app-options-selector>
        </div>
      }
      <div class="hidden gap-4 lg:flex md:items-center md:px-3">
        <div class="text-blue-800 dark:text-blue-900">
          <svg
            icon="logo"
            width="48"
            height="60"
            stroke="currentColor"
            stroke-width="2"
          ></svg>
        </div>
      </div>
    </div>
  </div>
</section>
