@let stopData = stop();
@let vm = vm$ | async;
@if (stopData && vm) {
  <button
    type="button"
    class="stop-card"
    [attr.aria-pressed]="selected()"
    [class]="'stop-card stop-card-' + stopData.style"
    [style.width.%]="100"
    [style.height.%]="100"
    (click)="onSelectStop(stopData.id, selected())"
  >
    <div class="absolute inset-0 -z-10 backdrop-blur-sm"></div>
    <div class="flex items-start justify-between">
      <div>
        <div
          class="flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400"
        >
          <span>Stop</span>
          <span class="flex items-center">
            @if (stopData.availableDirections.includes('forward')) {
              <svg
                icon="forward"
                width="18"
                height="18"
                stroke="currentColor"
                stroke-width="2"
              ></svg>
            }
            @if (stopData.availableDirections.includes('backward')) {
              <svg
                icon="backward"
                width="18"
                height="18"
                stroke="currentColor"
                stroke-width="2"
              ></svg>
            }
                </span>
        </div>
        <div
          class="mt-1 text-lg font-semibold text-slate-900 dark:text-white"
        >
          {{ stopData.name }}
        </div>
      </div>
      @if (selected()) {
        <span
          class="absolute top-3 right-3 rounded-full bg-white px-2 py-0.5 text-xs text-black dark:bg-white/10 dark:text-white"
        >Selected</span
        >
      }
    </div>
    <div
      class="mt-3 flex flex-col items-start justify-between basis-full line-clamp-2 text-sm text-slate-600 dark:text-slate-300"
    >
      @if (showDescriptions()) {
        <span>{{ stopData.description }}</span>
      }
      @if (showDepartures()) {
        @let departure = getDeparture(stopData, vm.selectedDirectionName);
        @if (departure?.first && departure?.last) {
          <div
            class="mt-2 flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400"
          >
            <svg
              icon="clock"
              width="18"
              height="18"
              stroke="currentColor"
              stroke-width="2"
            ></svg>
            <span>
              {{ departure?.first }} • {{ departure?.last }}
            </span>
          </div>
        }
      }
    </div>
  </button>
}
