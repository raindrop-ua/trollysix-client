@let stop = stopData();
@let vm = vm$ | async;
@if (stop && vm) {
  @let isSelected = selected();
  <button
    type="button"
    class="stop-card"
    [attr.aria-pressed]="isSelected"
    [class]="'stop-card stop-card-' + stop.style"
    [class.stop-selected]="isSelected"
    [style.width.%]="100"
    [style.height.%]="100"
    (click)="onSelectStop(stop.id, isSelected)"
  >
    @if (showBackgroundImage() && stop.imageUrl) {
      <div class="absolute inset-0 backdrop-blur-sm z-1">
        <img
          [ngSrc]="stop.imageUrl"
          [alt]="stop.name"
          class="h-full w-full object-cover opacity-15"
          fill
        />
      </div>
    }
    <div class="flex items-start justify-between z-5">
      <div>
        <div
          class="flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400"
        >
          <span>Stop</span>
          <span class="flex items-center">
            @if (stop.availableDirections.includes('forward')) {
              <svg
                icon="forward"
                width="18"
                height="18"
                stroke="currentColor"
                stroke-width="2"
              ></svg>
            }
            @if (stop.availableDirections.includes('backward')) {
              <svg
                icon="backward"
                width="18"
                height="18"
                stroke="currentColor"
                stroke-width="2"
              ></svg>
            }
          </span>
        </div>
        <div class="mt-1 text-lg font-semibold text-slate-900 dark:text-white">
          {{ stop.name }}
        </div>
      </div>
      @if (selected()) {
        <span
          class="absolute top-3 right-3 rounded-full bg-white px-2 py-0.5 text-xs text-black dark:bg-white/10 dark:text-white"
        >
          Selected
        </span>
      }
    </div>
    <div
      class="flex flex-col items-start justify-end basis-full line-clamp-2 text-sm text-slate-600 dark:text-slate-300 z-5"
    >
      @if (showDescriptions()) {
        <span>{{ stop.description }}</span>
      }
      @if (showDepartures()) {
        @let departure = getDeparture(stop, vm.selectedDirectionName);
        <div
          class="mt-2 flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400"
        >
          <svg
            icon="clock"
            width="18"
            height="18"
            stroke="currentColor"
            stroke-width="2"
          ></svg>
          @if (departure?.first && departure?.last) {
            <span> {{ departure?.first }} • {{ departure?.last }} </span>
          } @else {
            <span> No departures </span>
          }
        </div>
      }
    </div>
  </button>
}
