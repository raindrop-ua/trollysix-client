@if (vm$ | async; as vm) {
  <section class="container mx-auto max-w-6xl px-4 py-6 md:py-8">
    <div class="mb-4 flex items-center justify-between gap-2">
      <h2 class="text-base font-semibold text-slate-900 dark:text-slate-100">
        Select stop
      </h2>
      <div class="text-s text-slate-500 dark:text-slate-400">
        @if (vm.currentTimetable?.validFrom; as validFrom) {
          <span>Schedule valid from {{ validFrom | date: 'dd.MM.yyyy' }}</span>
        }
      </div>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-4"
         [class.md:grid-cols-3]="vm.stops.length === 3"
         [class.md:grid-cols-4]="vm.stops.length >= 4"
    >
      @for (stop of vm.stops; track stop.id) {
        @let selected = vm.selectedStop?.id === stop.id;
        <button
          type="button"
          class="stop-card"
          [attr.aria-pressed]="selected"
          [class]="'stop-card stop-card-' + stop.style"
          (click)="onSelectStop(stop.id)"
        >
          <div class="absolute inset-0 -z-10 backdrop-blur-sm"></div>
          <div class="flex items-start justify-between">
            <div>
              <div
                class="flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400"
              >
                <span>Stop</span>
                <span class="flex items-center">
                  @if (stop.availableDirections.includes('forward')) {
                    <svg
                      icon="forward"
                      width="18"
                      height="18"
                      stroke="currentColor"
                      stroke-width="2"
                    ></svg>
                  }
                  @if (stop.availableDirections.includes('backward')) {
                    <svg
                      icon="backward"
                      width="18"
                      height="18"
                      stroke="currentColor"
                      stroke-width="2"
                    ></svg>
                  }
                </span>
              </div>
              <div
                class="mt-1 text-lg font-semibold text-slate-900 dark:text-white"
              >
                {{ stop.name }}
              </div>
            </div>
            @if (selected) {
              <span
                class="absolute top-3 right-3 rounded-full bg-white px-2 py-0.5 text-xs text-black dark:bg-white/10 dark:text-white"
              >Selected</span
              >
            }
          </div>
          @if (showDescriptions()) {
            <div
              class="mt-3 flex flex-col items-start justify-between basis-full line-clamp-2 text-sm text-slate-600 dark:text-slate-300"
            >
              <span>{{ stop.description }}</span>
              <div
                class="mt-2 flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400"
              >
                <svg
                  icon="clock"
                  width="18"
                  height="18"
                  stroke="currentColor"
                  stroke-width="2"
                ></svg>
                <span
                >{{ stop.firstDeparture }} - {{ stop.lastDeparture }}</span
                >
              </div>
            </div>
          }
        </button>
      }
    </div>
  </section>
}
