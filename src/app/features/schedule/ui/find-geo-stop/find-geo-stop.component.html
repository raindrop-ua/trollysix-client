@if (geolocation.isGeolocationAvailable()) {
  <section class="container mx-auto max-w-6xl px-4 pb-6 md:pb-8">
    <div class="flex flex-wrap items-center justify-start gap-3">
      <button
        (click)="onClick()"
        class="cursor-pointer flex gap-2 rounded-2xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white shadow-sm ring-1 ring-black/10 hover:opacity-95 active:scale-[.98] dark:bg-white dark:text-slate-900 dark:ring-white/10">
        <span>Select closest stop</span>
        <svg icon="map" width="18" height="18" stroke="currentColor" stroke-width="2"></svg>
      </button>
    </div>
  </section>
}
