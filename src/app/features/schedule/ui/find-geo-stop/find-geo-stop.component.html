@if (geolocation.isGeolocationAvailable()) {
  <section class="container mx-auto max-w-6xl px-4 pb-6 md:pb-8">
    <div class="flex flex-wrap items-center justify-start gap-3">
      <button
        (click)="onClick()"
        class="cursor-pointer rounded-2xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white shadow-sm ring-1 ring-black/10 hover:opacity-95 active:scale-[.98] dark:bg-white dark:text-slate-900 dark:ring-white/10">
        Select closest stop
      </button>
      @if (state().status === 'loading') {
        <p>Retrieving...</p>
      }
      @if (state().status === 'success') {
        <p>Location received</p>
      }
      @if (state().status === 'error') {
        <p>Unable to get location</p>
      }
    </div>
  </section>
}
