@if (geolocation.isGeolocationAvailable()) {
  <section class="container mx-auto max-w-6xl px-4 pb-6 md:pb-8">
    <div class="flex flex-wrap items-center justify-start gap-3">
      <button
        (click)="onClick()"
        appBtn="primary"
        >
        <span>Select closest stop</span>
        <svg icon="map-pinned" width="20" height="20" stroke="currentColor" stroke-width="2"></svg>
      </button>
    </div>
  </section>
}
