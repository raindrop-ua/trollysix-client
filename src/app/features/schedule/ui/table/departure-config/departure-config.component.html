@if ((departures$ | async)?.length) {
  @let showSchedule = (showScheduleNumbers$ | async) ?? false;

  <div
    class="rounded-2xl baseline-borders baseline-surface p-3 backdrop-blur md:p-4"
  >
    <div
      class="flex flex-wrap items-center justify-end gap-3 text-xs text-blue-700 dark:text-slate-400"
    >
      <label
        class="flex cursor-pointer gap-3 items-center justify-between text-sm text-slate-500 dark:text-slate-400"
      >
        <span>Show schedule number</span>
        <div class="relative flex">
          <input
            id="showSchedules"
            class="peer h-6 w-12 cursor-pointer appearance-none rounded-full border border-gray-300 dark:border-gray-600 bg-gary-400 checked:border-blue-700 dark:checked:border-blue-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2"
            type="checkbox"
            [checked]="showSchedule"
            (change)="onToggleSchedule($event)"
          />
          <span
            class="pointer-events-none absolute left-1 top-1 block h-4 w-4 rounded-full bg-slate-700 motion-safe:transition-all motion-safe:duration-200 peer-checked:left-7 peer-checked:bg-blue-700 dark:peer-checked:bg-blue-600"
          ></span>
        </div>
      </label>
    </div>
  </div>
}
