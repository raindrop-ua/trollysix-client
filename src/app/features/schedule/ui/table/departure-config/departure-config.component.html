@if ((departures$ | async)?.length) {
  @let showSchedule = (showRunNumbers$ | async) ?? false;

  <div
    class="baseline-borders baseline-surface rounded-3xl p-3 shadow-sm backdrop-blur md:p-4"
  >
    <div
      class="flex flex-wrap items-center justify-end gap-3 text-xs text-blue-700 dark:text-slate-400"
    >
      <label
        class="flex cursor-pointer items-center justify-between gap-3 text-sm text-slate-500 dark:text-slate-400"
      >
        <span>{{ copySchedule.departureConfig.showScheduleNumber }}</span>
        <div class="relative flex">
          <input
            id="showSchedules"
            class="peer bg-gary-400 h-6 w-10 cursor-pointer appearance-none rounded-full border border-gray-300 shadow-sm checked:border-blue-700 focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2 focus-visible:outline-none dark:border-gray-600 dark:checked:border-blue-600"
            type="checkbox"
            [checked]="showSchedule"
            (change)="onToggleSchedule($event)"
          />
          <span
            class="pointer-events-none absolute top-1 left-1 block h-4 w-4 rounded-full bg-slate-700 peer-checked:left-5 peer-checked:bg-blue-700 motion-safe:transition-all motion-safe:duration-200 dark:peer-checked:bg-blue-600"
          ></span>
        </div>
      </label>
    </div>
  </div>
}
