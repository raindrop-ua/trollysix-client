<button
  class="relative w-full cursor-default focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-slate-200/50"
  [class]="timeClass()"
  (click)="onClick()"
>
  @let dep = departure();
  <time class="cursor-default">{{ dep.time }}</time>
  @if (showSchedule() && dep.scheduleNumber !== null) {
    <div class="cursor-default absolute -top-1 -right-1 backdrop-blur-xs inline-flex items-center rounded-xl bg-gray-400/20 px-2 py-1 text-xs font-medium inset-ring inset-ring-gray-400/20 shadow-sm">
      #{{ dep.scheduleNumber }}
    </div>
  }
</button>
