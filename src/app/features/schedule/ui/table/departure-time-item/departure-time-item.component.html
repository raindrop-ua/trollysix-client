<div
  class="relative w-full cursor-default focus:ring-2 focus:ring-slate-200/50 focus:ring-offset-2 focus:ring-offset-slate-900 focus:outline-none"
  [class]="timeClass()"
>
  @let dep = departure();
  <time class="cursor-default">{{ dep.time | timeUi }}</time>
  @if (showSchedule() && dep.runNumber !== null) {
    <div
      class="absolute -top-1 -right-1 inline-flex transform-gpu cursor-default items-center rounded-xl bg-gray-400/20 px-2 py-1 text-xs font-medium shadow-sm inset-ring inset-ring-gray-400/20 backdrop-blur-xs"
    >
      #{{ dep.runNumber }}
    </div>
  }
</div>
