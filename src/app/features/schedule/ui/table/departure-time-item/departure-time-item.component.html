<div
  class="ts-departure-time-reveal"
  [style.--ts-time-reveal-delay]="revealDelay()"
>
  <button
    type="button"
    [attr.aria-pressed]="selected()"
    [class.ts-time-selected]="selected()"
    (click)="clickTime.emit(departure().scheduleTime)"
    class="relative w-full cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-300"
    [class]="timeClass()"
  >
    @let dep = departure();
    <time>{{ dep.time | timeUi }}</time>
    @if (showSchedule() && dep.runNumber !== null) {
      <span
        class="absolute -top-1 -right-1 inline-flex transform-gpu items-center rounded-xl bg-gray-400/20 px-2 py-1 text-xs font-medium shadow-sm inset-ring inset-ring-gray-400/20 backdrop-blur-xs"
      >
        #{{ dep.runNumber }}
      </span>
    }
  </button>
</div>
