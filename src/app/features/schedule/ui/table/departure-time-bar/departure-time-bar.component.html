<div class="mb-4 flex flex-wrap items-center justify-between gap-3">
  <div
    class="flex items-center gap-2 text-lg text-blue-700 dark:text-yellow-500"
  >
    <span>
      <svg
        icon="clock"
        class="size-6"
        stroke="currentColor"
        stroke-width="2"
      ></svg>
    </span>
    <time class="font-mono">
      {{ clockService.now$ | async | date: 'HH:mm' }}
    </time>
  </div>
  <div
    class="flex items-center gap-2 text-lg text-blue-700 dark:text-yellow-500"
  >
    <span>
      <svg
        icon="circle-arrow-right"
        class="size-6"
        stroke="currentColor"
        stroke-width="2"
      ></svg>
    </span>
    <time class="font-mono">
      {{ label$ | async }}
    </time>
  </div>
</div>
