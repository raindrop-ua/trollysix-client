<div class="mb-4 flex flex-wrap items-center justify-between gap-3">
  <div class="flex items-center gap-2 text-lg text-blue-700 dark:text-yellow-500">
    <span>
      <svg
        icon="clock"
        width="24"
        height="24"
        stroke="currentColor"
        stroke-width="2"
      ></svg>
    </span>
    <span class="font-mono text-blue-700 dark:text-yellow-500">
      {{ clockService.now$ | async | date : 'HH:mm' }}
    </span>
  </div>
  <div class="flex items-center gap-2 text-lg text-blue-700 dark:text-yellow-500">
    <span>
      <svg
        icon="clock"
        width="24"
        height="24"
        stroke="currentColor"
        stroke-width="2"
      ></svg>
    </span>
    <span class="font-mono text-blue-700 dark:text-yellow-500">
      {{ label$ | async }}
    </span>
  </div>
</div>
