@if (vm$ | async; as vm) {
  <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
    <h3
      class="cursor-default py-1 text-xl font-semibold text-slate-900 dark:text-white"
    >
      <div>{{ vm.selectedStop?.name }}</div>
    </h3>
    @let departures = departures$ | async;
    @if (departures && departures.length) {
      <div
        class="inline-flex cursor-default items-center gap-x-1.5 rounded-full border border-blue-600 bg-blue-100 px-5 py-1 font-normal text-blue-600 tabular-nums dark:border-blue-900 dark:bg-blue-800/30 dark:text-blue-200"
      >
        {{ departures.length }} departures
      </div>
    }
  </div>
}
