@if (vm$ | async; as vm) {
<div class="mb-4 flex flex-wrap items-center justify-between gap-3">
  <h3 class="text-xl font-semibold text-slate-900 dark:text-white">
    <div>{{ vm.selectedStop?.name }}</div>
  </h3>
  @let departures = (departures$ | async);
  @if (departures && departures.length) {
    <div class="font-normal inline-flex items-center gap-x-1.5 py-1.5 px-3 rounded-full border border-blue-600 text-blue-600 bg-blue-100 dark:border-blue-900 dark:text-blue-200 dark:bg-blue-800/30">
      {{ departures.length }} departures
    </div>
  }
</div>
}
