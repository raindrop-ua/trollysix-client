@if ((departures$ | async)?.length) {
  <div
    class="baseline-borders baseline-surface rounded-3xl p-3 backdrop-blur md:p-4"
  >
    <div
      class="flex flex-wrap items-center gap-2 text-xs text-slate-500 dark:text-slate-400"
    >
      <span
        class="cursor-default rounded-xl bg-teal-400/30 px-2.5 py-1.5 font-medium text-teal-900 dark:text-teal-100"
        >Later today</span
      >
      <span
        trollysixTooltip="≤ 15 min"
        trollysixTooltipPlacement="top"
        class="cursor-default rounded-xl bg-amber-400 px-2.5 py-1.5 font-medium text-slate-900"
        >Soon</span
      >
      <span
        trollysixTooltip="≤ 5 min"
        trollysixTooltipPlacement="top"
        class="cursor-default rounded-xl bg-red-500/80 px-2.5 py-1.5 font-medium text-white"
        >Departing</span
      >
      <span
        class="cursor-default rounded-xl bg-slate-800/10 px-2.5 py-1.5 font-medium text-slate-600 dark:bg-white/5 dark:text-slate-400"
        >Departed</span
      >
    </div>
  </div>
}
