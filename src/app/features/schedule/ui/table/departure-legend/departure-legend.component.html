@if ((departures$ | async)?.length) {
  <div
    class="baseline-borders baseline-surface rounded-3xl p-3 backdrop-blur md:p-4"
  >
    <div
      class="flex flex-wrap items-center gap-2 text-xs text-slate-500 dark:text-slate-400"
    >
      <span
        class="ts-time-coming cursor-default rounded-xl px-2.5 py-1.5 font-medium"
        >Later today</span
      >
      <span
        trollysixTooltip="≤ 15 min"
        trollysixTooltipPlacement="top"
        class="ts-time-soon cursor-default rounded-xl px-2.5 py-1.5 font-medium"
        >Soon</span
      >
      <span
        trollysixTooltip="≤ 5 min"
        trollysixTooltipPlacement="top"
        class="ts-time-now-legend cursor-default rounded-xl px-2.5 py-1.5 font-medium"
        >Departing</span
      >
      <span
        class="ts-time-past cursor-default rounded-xl px-2.5 py-1.5 font-medium"
        >Departed</span
      >
      <span
        class="ts-time-canceled cursor-default rounded-xl px-2.5 py-1.5 font-medium"
        >Canceled</span
      >
    </div>
  </div>
}
