@if ((departures$ | async)?.length) {
  <div class="rounded-2xl border border-white/10 bg-white/60 p-3 shadow-sm backdrop-blur md:p-4 dark:bg-slate-900/40">
    <div class="flex flex-wrap items-center gap-3 text-xs text-slate-500 dark:text-slate-400">
      <span class="rounded-md bg-teal-400/30 px-2 py-1 text-teal-900 dark:text-teal-100">
        Upcoming
      </span>
      <span class="rounded-md bg-amber-400 px-2 py-1 text-slate-900">Soon</span>
      <span class="rounded-md bg-red-500/80 px-2 py-1 text-white">Now</span>
      <span class="rounded-md bg-slate-800/10 px-2 py-1 text-slate-600 dark:bg-white/5 dark:text-slate-400">
        Past
      </span>
    </div>
  </div>
}
