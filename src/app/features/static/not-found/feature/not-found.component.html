<trollysix-generic-header [title]="'Page Not Found'" />
<trollysix-generic-section-block class="relative mt-8 mb-20 block">
  <div class="mx-auto max-w-2xl text-center">
    <p class="text-lg text-slate-700 dark:text-slate-200">
      We couldn&apos;t find the page you were looking for.
    </p>
    <p class="mt-3 text-slate-500 dark:text-slate-400">
      The link may be outdated, or the page may have been moved.
    </p>
    <div class="mt-6 flex flex-wrap items-center justify-center gap-3">
      <a [routerLink]="['/']" trollysixBtn="secondary"> Go to Home </a>
      <a [routerLink]="['/schedule']" trollysixBtn="primary"> Open Schedule </a>
    </div>
  </div>
</trollysix-generic-section-block>
