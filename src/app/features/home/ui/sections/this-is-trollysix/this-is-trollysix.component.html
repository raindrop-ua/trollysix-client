<section class="baseline-container relative py-20">
  <h2
    class="mb-6 text-center text-3xl/10 font-bold text-slate-900 md:text-5xl/14 dark:text-white"
  >
    {{ copyHome.thisIsTrollySix.titleBeforeBrand }}<br />{{ copyHome.thisIsTrollySix.titleAfterBreak }}<span
      class="text-blue-700 dark:text-yellow-500"
      >{{ copyHome.thisIsTrollySix.titleBrandSuffix }}</span
    >
  </h2>
  <p
    class="mx-auto max-w-2xl text-center text-lg text-slate-600 md:text-xl dark:text-slate-300"
  >
    {{ copyHome.thisIsTrollySix.description }}
  </p>

  <div class="mt-10 grid grid-cols-1 gap-4 md:grid-cols-3">
    @for (valueProp of valueProps; track valueProp; let i = $index) {
      <trollysix-value-prop
        [valueProp]="valueProp"
        [trollysixRevealOnScroll]="300 + i * 300"
      />
    }
  </div>
</section>
