<section class="baseline-container relative pb-14 md:pb-20">
  <div
    class="baseline-borders baseline-surface rounded-3xl p-14 text-center shadow-md backdrop-blur"
  >
    <h2
      class="mx-auto max-w-4xl text-3xl font-bold tracking-tight text-slate-900 md:text-5xl dark:text-white"
    >
      {{ copyHome.bigClaims.title }}
      <span class="opacity-70">{{ copyHome.bigClaims.subtitle }}</span>
    </h2>
    <p
      class="mx-auto mt-4 max-w-2xl text-slate-600 md:text-lg dark:text-slate-300"
    >
      {{ copyHome.bigClaims.description }}
    </p>
    <div class="mt-7">
      <a [routerLink]="[AppRouteEnum.Schedule]" trollysixBtn="primary">{{
        copyCommon.viewSchedule
      }}</a>
    </div>
  </div>
  <trollysix-color-splash
    aria-hidden="true"
    class="text-sky-700/25 dark:text-blue-400/33"
  />
</section>
