<div class="pointer-events-none absolute inset-0 z-40 motion-reduce:hidden">
  @for (snowflake of snowService.getSnowflakes(); track snowflake.id) {
    <div
      class="pointer-events-none absolute rounded-full bg-blue-500 dark:bg-white"
      [style.left.%]="snowflake.x"
      [style.top.%]="snowflake.y"
      [style.width.rem]="snowflake.size"
      [style.height.rem]="snowflake.size"
      [style.opacity]="snowflake.opacity"
    ></div>
  }
</div>
