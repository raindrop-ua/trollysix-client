<section class="container mx-auto max-w-6xl px-4 py-16 md:py-20">
  <div class="mb-8 text-center">
    <h3 class="text-2xl md:text-4xl font-bold text-slate-900 dark:text-white">
      Loved by everyday riders
    </h3>
    <p class="mt-3 text-slate-600 dark:text-slate-300">
      No advertising. No noise. Just what helps you get things done.
    </p>
  </div>

  @if (testimonials().length) {
    <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
      @for (testimonial of testimonials(); track testimonial.id; let i = $index) {
        <app-testimonial [testimonial]="testimonial" [appRevealOnScroll]="300 + (i * 300)"/>
      }
    </div>
  } @else {
    <app-spinner />
  }
</section>
