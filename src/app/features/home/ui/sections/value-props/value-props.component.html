<section class="container mx-auto max-w-6xl px-4 pb-12 md:pb-16">
  <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
    @for (valueProp of valueProps; track valueProp; let i = $index) {
      <app-value-prop [valueProp]="valueProp" [appRevealOnScroll]="300 + (i * 300)"/>
    }
  </div>
</section>
