<app-generic-section-block class="block mb-10">
  <header class="mb-4">
    <h2 class="text-xl font-semibold text-slate-900 dark:text-white">
      List of stops of the route
    </h2>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300"></p>
  </header>

  <div class="flex w-full flex-col items-start mt-8">
    @for (stop of routeStops; track stop; let i = $index, last = $last) {
      <div class="group flex gap-x-6">
        <div class="relative">
          @if (!last) {
            <div class="absolute left-1/2 top-0 h-full w-0.5 -translate-x-1/2 bg-slate-200"></div>
          }
          <span class="relative z-10 grid h-10 w-10 place-items-center rounded-full bg-slate-200 text-slate-800">
              <svg
                [icon]="stop.direction"
                width="18"
                height="18"
                stroke="currentColor"
                stroke-width="2"
              ></svg>
          </span>
        </div>
        <div
          class="-translate-y-1.5 text-slate-600"
          [class.pb-8]="!last"
        >
          <p class="font-sans pt-2 text-base font-bold text-slate-800 antialiased dark:text-white">
            {{ stop.title }}
          </p>
          <small class="mt-2 font-sans text-sm text-slate-600 dark:text-slate-400 antialiased">
            {{ stop.description }}
          </small>
        </div>
      </div>
    }
  </div>

</app-generic-section-block>
