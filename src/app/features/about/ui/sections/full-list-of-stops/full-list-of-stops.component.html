<trollysix-generic-section-block class="mb-20 block">
  <header>
    <h2 class="text-xl font-semibold text-slate-900 dark:text-white">
      {{ copyAbout.fullListOfStops.title }}
    </h2>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300"></p>
  </header>

  @if (routeStops().length) {
    <div class="grid grid-cols-1 gap-4 sm:gap-6 md:grid-cols-2">
      <trollysix-stops-list
        [title]="copyAbout.fullListOfStops.forwardDirection"
        [direction]="'forward'"
        [stops]="routeStopsForward()"
      />
      <trollysix-stops-list
        [title]="copyAbout.fullListOfStops.backwardDirection"
        [direction]="'backward'"
        [stops]="routeStopsBackward()"
      />
    </div>
  } @else {
    <trollysix-spinner />
  }
</trollysix-generic-section-block>
