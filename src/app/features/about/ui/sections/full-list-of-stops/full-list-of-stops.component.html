<app-generic-section-block class="block mb-10">
  <header>
    <h2 class="text-xl font-semibold text-slate-900 dark:text-white">
      List of stops of the route
    </h2>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300"></p>
  </header>

  @if (routeStops().length) {
    <div class="grid gap-3 sm:gap-4 grid-cols-1 md:grid-cols-2">
      <div class="mt-8">
        <h4 class="mb-4 text-base font-semibold text-slate-900 dark:text-white flex items-center gap-2">
          <span>Forward direction</span>
          <svg
            icon="forward"
            width="16"
            height="16"
            stroke="currentColor"
            stroke-width="2"
          ></svg>
        </h4>
        <div class="flex w-full flex-col items-start">
          @for (stop of routeStopsForward(); track stop.id; let i = $index, last = $last) {
            <app-stops-list-item [stopItemData]="stop" [itemIndex]="i" [isLastItem]="last" />
          }
        </div>
      </div>
      <div class="mt-8">
        <h4 class="mb-4 text-base font-semibold text-slate-900 dark:text-white flex items-center gap-2">
          <span>Backward direction</span>
          <svg
            icon="backward"
            width="16"
            height="16"
            stroke="currentColor"
            stroke-width="2"
          ></svg>
        </h4>
        <div class="flex w-full flex-col items-start">
          @for (stop of routeStopsBackward(); track stop.id; let i = $index, last = $last) {
            <app-stops-list-item [stopItemData]="stop" [itemIndex]="i" [isLastItem]="last" />
          }
        </div>
      </div>
    </div>
  } @else {
    <app-spinner />
  }

</app-generic-section-block>
