<div class="group flex gap-x-4">
  <div class="relative">
    @if (!isLastItem()) {
      <div class="absolute left-1/2 top-0 h-full w-0.5 -translate-x-1/2 bg-slate-200"></div>
    }
    <span class="relative z-10 grid h-8 w-8 place-items-center rounded-full bg-slate-200 text-slate-800">
      <svg
        [icon]="stopItemData().direction"
        width="16"
        height="16"
        stroke="currentColor"
        stroke-width="2"
      ></svg>
    </span>
  </div>
  <div
    class="text-slate-600"
    [class.pb-5]="!isLastItem()"
  >
    <div class="flex flex-col gap-1">
      <p class="pt-1 text-sm font-bold text-slate-800 antialiased dark:text-white">
        {{ stopItemData().title }}
      </p>
      <small class="text-sm text-slate-600 dark:text-slate-400 antialiased">
        {{ stopItemData().description }}
      </small>
    </div>
  </div>
</div>
