<div class="mt-8">
  <h4 class="mb-4 text-base font-semibold text-slate-900 dark:text-white flex items-center gap-2">
    <span>{{ title() }}</span>
    <svg
      [icon]="direction()"
      width="16"
      height="16"
      stroke="currentColor"
      stroke-width="2"
    ></svg>
  </h4>
  <div class="flex w-full flex-col items-start">
    @for (stop of stops(); track stop.id; let i = $index, last = $last) {
      <app-stops-list-item [stopItemData]="stop" [itemIndex]="i" [isLastItem]="last" />
    }
  </div>
</div>
