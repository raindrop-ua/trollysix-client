<trollysix-generic-section-block class="mb-12 block">
  <header class="mb-4">
    <h2 class="text-xl font-semibold text-slate-900 dark:text-white">
      Route 6 Operation
    </h2>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300"></p>
  </header>
  <div class="flex flex-col gap-5">
    <trollysix-route-operation-table
      [dayOperatingData]="operatingData().weekday"
    />
    <trollysix-route-operation-table
      [dayOperatingData]="operatingData().weekend"
    />
  </div>
</trollysix-generic-section-block>
