<ng-template
  [appCheatCode]="'IDDQD'"
  [appCheatCodeTimeout]="1500"
  (cheatSuccess)="onCheatEnter()"
>
  <app-generic-section-block appRevealOnScroll="600" class="mb-10 block relative overflow-hidden">
    <div appRevealOnScroll="600">
      <div class="relative overflow-hidden mt-2 aspect-[16/10] w-full rounded-xl bg-slate-900/5 ring-1 ring-slate-900/10 dark:bg-white/5 dark:ring-white/10">
        <img ngSrc="assets/images/happy_holidays.webp" alt="Happy Holidays" width="1054" height="703">
      </div>
    </div>
  </app-generic-section-block>
</ng-template>
