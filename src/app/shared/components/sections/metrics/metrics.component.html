<section class="container mx-auto max-w-6xl px-4 py-10">
  @if (data().length) {
    <div
      [class.sm:grid-cols-3]="mobileFullWidth()"
      [class.grid-cols-3]="!mobileFullWidth()"
      class="grid gap-3 text-center sm:gap-4"
    >
      @for (metric of data(); track metric) {
        <app-metric [title]="metric.title" [description]="metric.description" />
      }
    </div>
  }
</section>
