<div class="flex items-center gap-2">
  <button
    trollysixIconButton
    [variant]="'default'"
    type="button"
    [attr.aria-pressed]="textSizeService.isLarge()"
    [attr.aria-label]="textSizeService.isLarge() ? 'Use normal font size' : 'Use large font size'"
    (click)="toggleTextSize()"
  >
    @if (modeSignal() === 'normal') {
      <svg
        icon="a-up"
        class="size-4"
        stroke="currentColor"
        stroke-width="2"
      ></svg>
    } @else {
      <svg
        icon="a-down"
        class="size-4"
        stroke="currentColor"
        stroke-width="2"
      ></svg>
    }

    <span class="sr-only">Toggle font size</span>
  </button>
</div>
