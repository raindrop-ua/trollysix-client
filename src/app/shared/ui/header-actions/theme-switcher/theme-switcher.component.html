<div class="flex items-center gap-2">
  <button
    appIconButton
    [variant]="'default'"
    [attr.aria-label]="'Theme: ' + themeSignal()"
    [attr.title]="'Theme: ' + themeSignal() + ' — click to toggle'"
    (click)="toggleTheme()"
  >
    @if (themeSignal() === 'light') {
      <svg
        icon="light"
        class="size-4"
        stroke="currentColor"
        stroke-width="2"
      ></svg>
    } @else {
      <svg
        icon="dark"
        class="size-4"
        stroke="currentColor"
        stroke-width="2"
      ></svg>
    }
    <span class="sr-only">Toggle theme</span>
  </button>
</div>
