<section
  class="relative bg-linear-to-r from-sky-500/10 to-indigo-500/10 py-20 dark:from-sky-700/20 dark:to-indigo-700/20"
>
  <svg
    class="absolute top-0 right-0 -mt-8 mr-12 h-8 text-yellow-500 md:mr-28 xl:mr-32 dark:text-blue-900"
    viewBox="0 0 300 177"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path d="M64.6154 0L0 177H78.4616L143.077 0H64.6154Z" fill="currentColor" />
    <path
      d="M221.538 0L156.923 177H235.385L300 0H221.538Z"
      fill="currentColor"
    />
  </svg>

  <div class="baseline-container text-center">
    @if (titleTemplate()) {
      <h2
        class="mb-6 text-3xl font-extrabold text-slate-900 md:text-5xl dark:text-white"
      >
        <ng-container [ngTemplateOutlet]="titleTemplate()" />
      </h2>
    }
    @if (descriptionTemplate()) {
      <p
        class="mx-auto max-w-2xl text-lg text-slate-600 md:text-xl dark:text-slate-300"
      >
        <ng-container [ngTemplateOutlet]="descriptionTemplate()" />
      </p>
    }
    @if (ctaTemplate()) {
      <div class="mt-8 flex items-center justify-center gap-3">
        <ng-container [ngTemplateOutlet]="ctaTemplate()" />
      </div>
    }
  </div>
</section>
