<section class="baseline-container py-10">
  @if (data().length) {
    <div
      [class.sm:grid-cols-3]="mobileFullWidth()"
      [class.grid-cols-3]="!mobileFullWidth()"
      class="grid gap-3 text-center sm:gap-4"
    >
      @for (metric of data(); track metric) {
        <trollysix-metric
          [title]="metric.title"
          [description]="metric.description"
        />
      }
    </div>
  }
</section>
