<div class="baseline-container relative py-6">
  <div
    class="flex flex-col items-center justify-between gap-3 text-sm sm:flex-row"
  >
    <div class="flex gap-3">
      <div>© 2024-{{ currentYear }} TrollySix. {{ copyFooter.rightsReserved }}</div>
      <div class="inline-flex items-center gap-2 font-normal text-emerald-600 transition-colors hover:text-emerald-500 dark:text-emerald-500 dark:hover:text-emerald-400">
        <span class="relative flex h-2 w-2">
          <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-current opacity-60"></span>
          <span class="relative inline-flex h-2 w-2 rounded-full bg-current"></span>
        </span>
      </div>
    </div>
    @if (showStaticLinks()) {
      <div>
        <ul class="flex gap-3">
          <li>
            <a class="hover:underline" [routerLink]="AppRouteEnum.PrivacyPolicy"
            >{{ copyFooter.privacyPolicy }}</a
            >
          </li>
          <li>
            <a class="hover:underline" [routerLink]="AppRouteEnum.TermsOfUse"
            >{{ copyFooter.termsOfUse }}</a
            >
          </li>
          <li>
            <a class="hover:underline" [routerLink]="AppRouteEnum.Support"
            >{{ copyFooter.support }}</a
            >
          </li>
        </ul>
      </div>
    }
  </div>
</div>
